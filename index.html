<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="내가 만든 게임을 모아 보고 테스트하는 개인 게임 라이브러리">
  <title>Game Library | 개인 게임 라이브러리</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="홈으로">
        <span class="brand-mark" aria-hidden="true">▦</span><span>GAME LIBRARY</span>
      </a>
      <span class="header-caption">개인 게임 보관함 <span class="dot" aria-hidden="true"></span> 테스트 빌드</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">MY GAMES / BUILDS</p>
          <h1 id="intro-title">내가 만든 게임들</h1>
          <p class="intro-description">개발 중인 게임의 버전과 지원 기기를 확인하고, 웹 게임은 바로 실행할 수 있는 공간입니다.</p>
        </div>
        <div class="count-box" aria-live="polite"><strong id="game-count">—</strong><span>등록된 게임</span></div>
      </section>

      <section class="catalog" aria-labelledby="catalog-heading">
        <div class="section-heading">
          <h2 id="catalog-heading">게임 목록</h2>
          <div class="filters" role="group" aria-label="지원 플랫폼 필터">
            <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter" type="button" data-filter="web" aria-pressed="false">웹</button>
            <button class="filter" type="button" data-filter="windows" aria-pressed="false">PC</button>
            <button class="filter" type="button" data-filter="android" aria-pressed="false">모바일</button>
          </div>
        </div>
        <div class="toolbar">
          <label class="search-field"><span class="sr-only">게임 검색</span><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="6.7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="게임 이름 검색" autocomplete="off"></label>
          <span id="match-count" class="match-count" aria-live="polite"></span>
        </div>
        <div id="game-grid" class="game-grid" aria-live="polite"><p class="status-message">게임 목록을 불러오는 중...</p></div>
      </section>
    </main>

    <footer><span>개인 게임 라이브러리</span><span>GitHub Pages · 정적 웹사이트</span></footer>
  </div>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="dialog-header"><span class="eyebrow">GAME DETAILS</span><button class="icon-button" id="close-dialog" type="button" aria-label="닫기">✕</button></div>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
